<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CellQ design options</title><link rel="stylesheet" href="preview.css"></head><body>
<header class="chooser"><b>CellQ desktop / design choices</b><a href="?design=a">A · Service workspace</a><a href="?design=b">B · Wide workspace</a><a href="?design=c">C · Technical workbench</a><a href="index.html">Compare all</a></header><main id="designs"></main>
<script>
const options=[['a','Service workspace','Recommended','Clear sidebar navigation, spacious panels, and a persistent device card.'],['b','Wide workspace','Full-width content','Top navigation and a device banner maximize the space available for tables.'],['c','Technical workbench','Higher information density','Compact navigation and a persistent inspector keep file details beside the table.']];
const nav=()=>['Device','Data Logs','Firmware Update','Diagnostics'].map((s,i)=>`<div class="nav-item ${i===1?'active':''}"><span>${['▣','▤','⇧','⌁'][i]}</span>${s}</div>`).join('');
const utilities='<div class="nav-item"><span>⚙</span>Settings</div><div class="nav-item"><span>?</span>Help</div>';
const badge='<span class="badge neutral">○ Disconnected</span>';
const titlebar='<div class="titlebar"><div class="logo"><img src="../references/mainPage.png" alt="CellQ reference wordmark"></div><b>Desktop Maintenance</b><span class="sample">SAMPLE PREVIEW</span><span class="caption-buttons">−　□　×</span></div>';
const ribbon='<div class="ribbon"><div><label>CONNECTION</label><div class="commands"><span class="select">No device selected　⌄</span><button disabled>Connect</button></div></div><div class="divider"></div><div><label>DATA LOGS</label><div class="commands"><button disabled>↻ Refresh</button><button disabled>↓ Download selected</button></div></div><small>Preview only · actions unavailable</small></div>';
const intro='<div class="intro"><div><label>MAINTENANCE WORKSPACE</label><h1>Data Logs</h1><p>Browse device logs and review verified local copies.</p></div><span class="badge neutral">Sample content</span></div>';
const notice='<div class="notice"><span class="info">i</span><div><b>Design preview — no device connected</b><p>All filenames, sizes, and verification states below are illustrative samples.</p></div></div>';
const table='<div class="table-panel"><div class="table-tools"><div class="tabs"><b>Local copies <small>4 sample files</small></b><span>Device logs</span></div><span class="filter">⌕　Filter by filename</span></div><table><thead><tr><th>□</th><th>Filename</th><th>Folder</th><th>Size</th><th>Local verification</th></tr></thead><tbody>'+[
['☑','sample_001.csv','20261008','124 KB','success','✓ Verified · sample'],['□','sample_002.csv','20261008','86 KB','success','✓ Verified · sample'],['□','sample_003.csv.part','20261007','42 KB','warning','Ⅱ Incomplete · sample'],['□','sample_004.csv','NO_RTC','18 KB','error','! Check failed · sample']].map((r,i)=>`<tr class="${i===0?'selected':''}"><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td><td><span class="badge ${r[4]}">${r[5]}</span></td></tr>`).join('')+'</tbody></table><div class="table-foot"><span>4 illustrative files · 1 selected</span><span>Device listing unavailable</span></div></div>';
const detail='<div class="detail panel"><div class="panel-heading"><b>Selected sample</b><span class="badge neutral">Preview</span></div><div class="file"><span>▤</span><div><b class="mono">sample_001.csv</b><p>Local copy · illustrative only</p></div></div><dl><dt>Source folder</dt><dd class="mono">/DATA/20261008/</dd><dt>File size</dt><dd class="mono">124 KB (sample)</dd><dt>Verification</dt><dd>✓ Verified (sample)</dd></dl><p class="detail-note">A completed download will require frame, offset, size, stream CRC, and whole-file checks.</p><button disabled>Open local copy</button></div>';
const progress='<div class="progress panel"><div class="panel-heading"><b>Transfer progress example</b><span class="badge neutral">Sample state</span></div><p>Verifying local copy · sample_001.csv</p><div class="track"><span></span></div><small>Illustrative progress · no transfer in progress</small></div>';
const device='<div class="device"><label>DEVICE</label><b>No connected device</b><p>Firmware version —</p>'+badge+'</div>';
const status='<footer class="status"><span>●　<b>Disconnected</b>　|　No device session</span><span>Sample preview　|　No hardware operations</span></footer>';
function render(o){let [id,title,tag,description]=o;let content='';if(id==='a')content=ribbon+`<div class="body"><aside><label>WORKSPACE</label>${nav()}<div class="utilities">${utilities}</div>${device}</aside><section>${intro}${notice}${table}<div class="lower">${detail}${progress}</div></section></div>`;if(id==='b')content=`<nav>${nav()}<div class="utilities">${utilities}</div></nav>`+ribbon+`<div class="device-banner"><span>▣　<b>No connected device</b>　　Firmware —</span>${badge}</div><section>${intro}${notice}${table}<div class="lower">${detail}${progress}</div></section>`;if(id==='c')content=ribbon+`<div class="body"><aside><label>WORKSPACE</label>${nav()}<div class="utilities">${utilities}</div>${device}</aside><section>${intro}${notice}<div class="workbench"><div>${table}${progress}</div>${detail}</div></section></div>`;return `<article class="concept ${id}"><header class="concept-heading"><span class="letter">${id.toUpperCase()}</span><div><h2>${title}<small>${tag}</small></h2><p>${description}</p></div></header><div class="app">${titlebar}${content}${status}</div><div class="concept-foot"><span><b>Segoe UI</b> · 14 px body / 26 px title · <b>Consolas</b> for file details</span><span><i style="background:#001D50"></i>Navy <i style="background:#0067BF"></i>Blue <i style="background:#00ACC0"></i>Cyan <i style="background:#E6E6E6"></i>Canvas</span></div></article>`;}
const chosen=new URLSearchParams(location.search).get('design');document.getElementById('designs').innerHTML=options.filter(o=>!chosen||o[0]===chosen).map(render).join('');if(chosen)document.body.classList.add('single');
</script></body></html>
